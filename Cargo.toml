[package]
name = "gc2607-isp"
version = "0.2.3"
edition = "2021"
description = "Software ISP for the GalaxyCore GC2607 colour camera (MateBook X Pro 2024)."
license = "MIT"
repository = "https://github.com/VitalyOstanin/gc2607-isp"

[dependencies]
# PNG output for the offline CLI (PNG only, to keep the dependency tree small).
image = { version = "0.25", default-features = false, features = ["png"] }
# Raw capture via libcamera. Optional: needs libcamera-dev + clang at build
# time, so it is built in a podman container (see Containerfile), not on the
# host. The host `cargo build` stays dependency-light without this feature.
libcamera = { version = "0.7", optional = true }
# Own minimal V4L2 layer (sensor subdev control for AE, v4l2loopback output)
# via raw ioctls. Optional: only the live video runtime needs it; the offline
# ISP stays std-only. The `v4l` crate is avoided (stale, no output API).
nix = { version = "0.31", optional = true, default-features = false, features = ["ioctl", "poll", "mman", "time", "signal"] }
# Data-parallel ISP for the live runtime. Optional: the offline ISP stays
# single-threaded and std-only. Thread count is set at runtime (--threads).
rayon = { version = "1.12", optional = true }
# GPU backend: the per-pixel pipeline stages run as Vulkan compute shaders via
# wgpu (mesa ANV on the Intel iGPU). Optional and self-contained — builds on the
# host without libcamera. pollster blocks on wgpu's async API; bytemuck packs
# the uniform/buffer structs.
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
# Run-time tuning window (gc2607-tune). Optional: only the tuning tool needs a
# GUI toolkit; the service binary stays without it. Rendered through OpenGL
# (glow) rather than wgpu: eframe tracks a newer wgpu major than the GPU
# backend, and two wgpu stacks in one build double the compile time.
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[features]
# Live video runtime: V4L2 sensor control (AE), v4l2loopback output, and
# data-parallel ISP (rayon).
video = ["dep:nix", "dep:rayon"]
# Raw capture via libcamera (gc2607-capture). Pulls in `video` for AE. Off by default.
capture = ["dep:libcamera", "video"]
# GPU backend (wgpu/Vulkan). Self-contained; selectable at runtime (--backend gpu).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Run-time tuning window (gc2607-tune): edits colour.conf, shows the camera.
tune = ["dep:eframe", "video"]

[dev-dependencies]
# Reference Malvar-He-Cutler implementation. Used only by the validation test
# that checks our own row-parallel MHC (pipeline::mhc_debayer) matches a known
# implementation; not linked into any binary.
demosaic = "0.3"
# Parses and validates the WGSL shader in a unit test, so a shader error fails
# `cargo test` instead of surfacing only when a GPU device builds the pipeline.
# Same major version as the naga that wgpu pulls in.
naga = { version = "29", features = ["wgsl-in"] }

[lib]
name = "gc2607_isp"
path = "src/lib.rs"

[[bin]]
name = "gc2607-isp"
path = "src/main.rs"

[[bin]]
name = "gc2607-capture"
path = "src/bin/capture.rs"
required-features = ["capture"]

[[bin]]
name = "gc2607-video"
path = "src/bin/video.rs"
required-features = ["capture"]

[[bin]]
name = "gpu-probe"
path = "src/bin/gpu_probe.rs"
required-features = ["gpu"]

[[bin]]
name = "gc2607-tune"
path = "src/bin/tune.rs"
required-features = ["tune"]

[profile.release]
opt-level = 3
lto = true
