# v4l2loopback options for the GC2607 virtual webcam.
#
# card_label is how gc2607-video locates this node (--device-label); it must match
# the label in the systemd unit. No video_nr is set on purpose: the node number is
# not fixed (the daemon finds the device by label, not by /dev/videoN).
#
# exclusive_caps=1 makes the device advertise capture capabilities to consumers
# only while a producer (gc2607-video) is attached, which is what applications
# expect from a webcam.
options v4l2loopback card_label="MateBook Camera (GC2607)" exclusive_caps=1 max_buffers=2
